<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ピサンカを作ろう！</title><style>body{font-family:system-ui,sans-serif;background:#fff9ed;margin:0;color:#23334b;text-align:center}main{max-width:620px;margin:auto;padding:20px}h1{margin-bottom:4px}p{color:#566}canvas{width:min(92vw,420px);height:auto;touch-action:none;background:white;border-radius:16px;box-shadow:0 3px 20px #0001}.tools{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:14px}.swatch{width:35px;height:35px;border-radius:50%;border:2px solid #bbb}.swatch.active{outline:3px solid #243b6b}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#245b9e;color:white;font-weight:600}button.secondary{background:#e8eaf0;color:#23334b}input{vertical-align:middle}small{display:block;margin:8px;color:#667}</style></head><body><main><h1>🇺🇦 ピサンカを作ろう！</h1><p>好きな色で卵の中に模様を描いてみよう！</p><canvas id="c" width="840" height="1000"></canvas><div class="tools" id="colors"></div><div class="tools"><label>ペンの太さ <input id="width" type="range" min="3" max="35" value="10"></label></div><div class="tools"><button class="secondary" id="undo">↶ もどす</button><button class="secondary" id="clear">消す</button><button id="save">画像を保存</button></div><small>指やマウスで描けます。画像は自分の端末に保存されます。</small></main><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),W=c.width,H=c.height;let color='#db3544',size=10,drawing=false,prev=null,history=[];
const palette=['#db3544','#f2a93b','#f5d94b','#2e9c65','#2177c6','#733c9f','#141414','#ffffff'];const cs=document.querySelector('#colors');palette.forEach(x=>{const b=document.createElement('button');b.className='swatch'+(x===color?' active':'');b.style.background=x;b.title=x;b.onclick=()=>{color=x;cs.querySelectorAll('button').forEach(y=>y.classList.remove('active'));b.classList.add('active')};cs.append(b)});
function eggPath(){const p=new Path2D();p.moveTo(420,80);p.bezierCurveTo(285,80,140,330,140,560);p.bezierCurveTo(140,790,265,920,420,920);p.bezierCurveTo(575,920,700,790,700,560);p.bezierCurveTo(700,330,555,80,420,80);p.closePath();return p}
const egg=eggPath();function base(){ctx.fillStyle='white';ctx.fillRect(0,0,W,H);ctx.lineWidth=7;ctx.strokeStyle='#243b6b';ctx.stroke(egg)}base();function snap(){history.push(ctx.getImageData(0,0,W,H));if(history.length>25)history.shift()}function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}c.addEventListener('pointerdown',e=>{e.preventDefault();snap();drawing=true;prev=pos(e);c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const q=pos(e);ctx.save();ctx.clip(egg);ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=color;ctx.lineWidth=Number(document.querySelector('#width').value);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.restore();ctx.strokeStyle='#243b6b';ctx.lineWidth=7;ctx.stroke(egg);prev=q});function stop(){drawing=false}c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);document.querySelector('#undo').onclick=()=>{const p=history.pop();if(p)ctx.putImageData(p,0,0)};document.querySelector('#clear').onclick=()=>{snap();base()};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download='my-pysanka.png';a.href=c.toDataURL('image/png');a.click()};
</script></body></html>
